<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ДДС{% endblock %}</title>
    {% load django_bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'cashflow:index' %}">ДДС</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'cashflow:index' %}">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'cashflow:record_create' %}">Создать запись</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'cashflow:manage_references' %}">Справочники</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    {% bootstrap_messages %}
    {% block content %}
    {% endblock %}
</div>
<script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
